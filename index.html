<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1F3A5F"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>FitProgress</title></head><body>
<header><div><small>FITPROGRESS</small><h1 id="title">Oggi</h1></div><button onclick="openTimerPicker()">⏱️</button></header><main id="app"></main>
<nav><button onclick="go('today')">🏠<span>Oggi</span></button><button onclick="go('workout')">🏋️<span>Scheda</span></button><button onclick="go('progress')">📈<span>Progressi</span></button><button onclick="go('nutrition')">🍽️<span>Nutrizione</span></button><button onclick="go('more')">⚙️<span>Altro</span></button></nav><div id="tm" class="hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const P={"Upper A":[["Incline chest press",3,"6-8","55 kg",150,2],["Low row neutral",3,"8-10","20 kg",120,2],["Flat chest press",3,"8-10","70 kg",120,2],["Triangle lat pulldown",3,"8-10","62.5 kg",120,2],["Pec fly",2,"10-15","66 kg",90,2],["Cable lateral raise",3,"12-20","3.75-5 kg",75,2],["Dumbbell curl",3,"8-12","12 kg",90,2]],"Lower A":[["45° leg press",3,"6-10","130 kg",150,2],["Smith lunge",3,"8-10 / gamba","20 kg",120,2],["Leg extension",3,"10-15","47.5 kg",90,2],["Seated leg curl",3,"8-12","42.5-45 kg",120,2],["Standing calf",3,"8-12","30-32 kg/lato",90,2],["Adductor",2,"10-15","50-55 kg",90,2],["Cable crunch",3,"10-15","22.5-27.5 kg",90,2]],"Upper B":[["T-bar row",3,"6-8","27.5 kg",150,2],["Triangle lat pulldown",3,"8-10","~60 kg",120,2],["Incline dumbbell press 30°",3,"8-10","20 kg",120,2],["One-arm dumbbell row",2,"8-12","18 kg",120,2],["Rear delt cable fly",3,"12-20","10-11 kg",75,2],["Dumbbell lateral raise",3,"10-15","9 kg",75,2],["Dumbbell curl",3,"8-12","12 kg",90,2]],"Lower B":[["Dumbbell Romanian deadlift",3,"6-8","20 kg",150,2],["Seated leg curl",3,"8-12","42.5-45 kg",120,2],["Lying leg curl",2,"10-15","34.5 kg",90,2],["45° leg press",3,"8-12","110-120 kg",120,2],["Leg extension",2,"10-15","45-47.5 kg",90,2],["Abductor",2,"12-15","50-55 kg",90,2],["Seated calf",3,"10-15","27-32 kg",90,2],["Plank",3,"45-75 sec","corpo libero",60,2]]};
const ladder=['7-6-6','7-7-6','7-7-7','8-7-7','8-8-7','8-8-8','8-8-8','8-8-8'], LE=['Incline chest press','45° leg press','T-bar row','Dumbbell Romanian deadlift'];
let page='today',workout='Upper A',week=1,data=JSON.parse(localStorage.getItem('fp')||'{}'),ti=null;
data.logs=data.logs||[];data.weights=data.weights||[];data.drafts=data.drafts||{};data.completed=data.completed||[];
function save(){localStorage.setItem('fp',JSON.stringify(data))}function go(p){page=p;render();scrollTo(0,0)}
function k(e,i){return week+'|'+workout+'|'+e+'|'+i}function get(e,i,f){return(data.drafts[k(e,i)]||{})[f]||''}
function put(e,i,f,v){data.drafts[k(e,i)]=data.drafts[k(e,i)]||{};data.drafts[k(e,i)][f]=v;save()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.className='toast';setTimeout(()=>t.className='toast hidden',1800)}
function render(){title.textContent={today:'Oggi',workout:'Allenamento',progress:'Progressi',nutrition:'Nutrizione',more:'Altro'}[page];app.innerHTML=page==='today'?today():page==='workout'?work():page==='progress'?prog():page==='nutrition'?nut():more()}
function today(){return`<section class="hero"><small>IL TUO ALLENAMENTO</small><h2>${workout}</h2><p>Settimana ${week} · I dati vengono salvati automaticamente mentre compili le serie.</p><button class="primary" onclick="go('workout')">Inizia allenamento</button></section><div class="grid"><div><b>${data.logs.length}</b><span>serie registrate</span></div><div><b>5 g</b><span>creatina/die</span></div><div><b>175 g</b><span>proteine</span></div></div>`}
function work(){let h=`<div class="chips">${Object.keys(P).map(x=>`<button onclick="workout='${x}';render()" class="${x==workout?'active':''}">${x}</button>`).join('')}</div><div class="controls">Settimana <select onchange="week=+this.value;render()">${[1,2,3,4,5,6,7,8].map(x=>`<option ${x==week?'selected':''}>${x}</option>`)}</select></div><div class="session"><b>${workout} · Settimana ${week}</b><button class="secondary" onclick="saveWorkout()">💾 Salva</button></div>`;
P[workout].forEach(x=>{let target=LE.includes(x[0])?ladder[week-1]:x[2];h+=`<article><div class="etop"><div><h3>${x[0]}</h3><p><b>Target:</b> ${target}</p></div><div class="load"><small>PESO INDICATIVO</small><strong>${x[3]}</strong></div></div><p class="meta">${x[1]} serie · ${x[4]}″ recupero · RIR ${x[5]}</p>${Array.from({length:x[1]},(_,i)=>`<div class="set"><b>${i+1}</b><input inputmode="numeric" placeholder="Reps" value="${get(x[0],i,'reps')}" oninput="put('${x[0].replaceAll("'","\\'")}',${i},'reps',this.value)"><input inputmode="decimal" placeholder="Kg" value="${get(x[0],i,'load')}" oninput="put('${x[0].replaceAll("'","\\'")}',${i},'load',this.value)"><input inputmode="numeric" placeholder="RIR" value="${get(x[0],i,'rir')}" oninput="put('${x[0].replaceAll("'","\\'")}',${i},'rir',this.value)"><button onclick="saveSet('${x[0].replaceAll("'","\\'")}',${i})">✓</button></div>`).join('')}<button class="timerbtn" onclick="openTimerPicker(${x[4]})">⏱ Recupero ${x[4]}″</button></article>`});
return h+`<div class="bottom"><button class="primary wide" onclick="saveWorkout()">💾 SALVA E TERMINA ALLENAMENTO</button></div>`}
function saveSet(e,i){let r=get(e,i,'reps');if(!r)return toast('Inserisci le ripetizioni');data.logs.push({date:new Date().toISOString(),week,workout,exercise:e,set:i+1,reps:r,load:get(e,i,'load'),rir:get(e,i,'rir')});save();toast('Serie salvata')}
function saveWorkout(){let n=0;P[workout].forEach(x=>{for(let i=0;i<x[1];i++){let r=get(x[0],i,'reps');if(r){let exists=data.logs.some(z=>z.week==week&&z.workout==workout&&z.exercise==x[0]&&z.set==i+1&&new Date(z.date).toDateString()==new Date().toDateString());if(!exists){data.logs.push({date:new Date().toISOString(),week,workout,exercise:x[0],set:i+1,reps:r,load:get(x[0],i,'load'),rir:get(x[0],i,'rir')});n++}}}});data.completed.push({date:new Date().toISOString(),week,workout});save();toast('Allenamento salvato · '+n+' nuove serie')}
function prog(){return`<article><h2>Peso</h2><div class="row"><input id="w" placeholder="86.0 kg" inputmode="decimal"><button class="secondary" onclick="addW()">Salva</button></div></article><article><h2>Storico peso</h2>${data.weights.slice(-12).reverse().map(x=>`<p><b>${x.v} kg</b> — ${x.d}</p>`).join('')||'<p>Nessun dato.</p>'}</article>`}
function addW(){let v=w.value;if(v){data.weights.push({v,d:new Date().toLocaleDateString('it-IT')});save();render()}}
function nut(){return`<article><h2>Target</h2><p><b>ON:</b> 2300 kcal · 175P · 65F · ~255C</p><p><b>OFF:</b> 2000 kcal · 175P · 60F · ~190C</p></article><article><h2>Integrazione</h2><p>Creatina monoidrato: <b>5 g/die</b>.</p><p>Whey: quanto serve per arrivare alle proteine.</p></article>`}
function more(){return`<article><h2>Backup</h2><button class="primary" onclick="backup()">📤 Esporta dati JSON</button><p>Include serie, bozze, peso e allenamenti completati.</p></article><article><h2>Installazione</h2><p>Safari → Condividi → Aggiungi alla schermata Home.</p></article>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='fitprogress-backup.json';a.click()}
function openTimerPicker(def){tm.className='timer';tm.innerHTML='<div class="timerbox"><h2>Timer recupero</h2><p>Scegli il recupero</p><div class="timers">'+[60,75,90,120,150,180].map(v=>`<button onclick="startTimer(${v})" class="${v==def?'selected':''}">${v}″</button>`).join('')+'</div><button class="secondary" onclick="closeTimer()">Chiudi</button></div>'}
function startTimer(s){clearInterval(ti);tm.className='timer';tm.innerHTML=`<div class="timerbox"><small>RECUPERO</small><b id="sec">${s}</b><div class="quick"><button onclick="startTimer(60)">60″</button><button onclick="startTimer(90)">90″</button><button onclick="startTimer(120)">120″</button><button onclick="startTimer(150)">150″</button></div><button class="primary" onclick="closeTimer()">Chiudi</button></div>`;ti=setInterval(()=>{s--;if(sec)sec.textContent=s;if(s<=0){clearInterval(ti);navigator.vibrate?.([200,100,200])}},1000)}
function closeTimer(){clearInterval(ti);tm.className='hidden'}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});addEventListener('pagehide',save);render();
</script></body></html>
