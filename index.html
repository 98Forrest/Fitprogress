<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1F3A5F"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>FitProgress</title></head><body><header><div><small>FITPROGRESS</small><h1 id="title">Oggi</h1></div><button onclick="timer(90)">⏱</button></header><main id="app"></main><nav><button onclick="page='today';render()">🏠<span>Oggi</span></button><button onclick="page='workout';render()">🏋️<span>Scheda</span></button><button onclick="page='progress';render()">📈<span>Progressi</span></button><button onclick="page='nutrition';render()">🍽️<span>Nutrizione</span></button><button onclick="page='more';render()">⚙️<span>Altro</span></button></nav><div id="tm" class="hidden"></div><script>
const P={"Upper A": [["Incline chest press", 3, "6-8", "55 kg", 150, 2], ["Low row neutral", 3, "8-10", "20 kg", 120, 2], ["Flat chest press", 3, "8-10", "70 kg", 120, 2], ["Triangle lat pulldown", 3, "8-10", "62.5 kg", 120, 2], ["Pec fly", 2, "10-15", "66 kg", 90, 2], ["Cable lateral raise", 3, "12-20", "3.75-5 kg", 75, 2], ["Dumbbell curl", 3, "8-12", "12 kg", 90, 2]], "Lower A": [["45° leg press", 3, "6-10", "130 kg", 150, 2], ["Smith lunge", 3, "8-10 / gamba", "20 kg", 120, 2], ["Leg extension", 3, "10-15", "47.5 kg", 90, 2], ["Seated leg curl", 3, "8-12", "42.5-45 kg", 120, 2], ["Adductor", 2, "10-15", "50-55 kg", 90, 2], ["Standing calf", 3, "8-12", "30-32 kg/lato", 90, 2], ["Cable crunch", 3, "10-15", "22.5-27.5 kg", 90, 2]], "Upper B": [["T-bar row", 3, "6-8", "27.5 kg", 150, 2], ["Triangle lat pulldown", 3, "8-10", "~60 kg", 120, 2], ["Incline dumbbell press 30°", 3, "8-10", "20 kg", 120, 2], ["One-arm dumbbell row", 2, "8-12", "18 kg", 120, 2], ["Rear delt cable fly", 3, "12-20", "10-11 kg", 75, 2], ["Dumbbell lateral raise", 3, "10-15", "9 kg", 75, 2], ["Dumbbell curl", 3, "8-12", "12 kg", 90, 2]], "Lower B": [["Dumbbell Romanian deadlift", 3, "6-8", "20 kg", 150, 2], ["Seated leg curl", 3, "8-12", "42.5-45 kg", 120, 2], ["Lying leg curl", 2, "10-15", "34.5 kg", 90, 2], ["45° leg press", 3, "8-12", "110-120 kg", 120, 2], ["Leg extension", 2, "10-15", "45-47.5 kg", 90, 2], ["Abductor", 2, "12-15", "50-55 kg", 90, 2], ["Seated calf", 3, "10-15", "27-32 kg", 90, 2], ["Plank", 3, "45-75 sec", "corpo libero", 60, 2]]};let page='today',workout='Upper A',week=1,data=JSON.parse(localStorage.getItem('fp')||'{}');data.logs=data.logs||[];data.weights=data.weights||[];
function save(){localStorage.setItem('fp',JSON.stringify(data))} function render(){document.getElementById('title').textContent={today:'Oggi',workout:'Allenamento',progress:'Progressi',nutrition:'Nutrizione',more:'Altro'}[page];let a=document.getElementById('app');if(page==='today')a.innerHTML=`<section class="hero"><small>IL TUO ALLENAMENTO</small><h2>${workout}</h2><p>Registra reps e carichi. I dati vengono salvati sul dispositivo.</p><button onclick="page='workout';render()">Inizia</button></section><div class="grid"><div><b>${data.logs.length}</b><span>serie registrate</span></div><div><b>5 g</b><span>creatina/die</span></div><div><b>175 g</b><span>proteine</span></div></div>`;if(page==='workout')a.innerHTML=work();if(page==='progress')a.innerHTML=prog();if(page==='nutrition')a.innerHTML=nut();if(page==='more')a.innerHTML=more()}
function work(){let h=`<div class="chips">${Object.keys(P).map(x=>`<button onclick="workout='${x}';render()" class="${x==workout?'active':''}">${x}</button>`).join('')}</div><div class="week">Settimana <select onchange="week=+this.value;render()">${[1,2,3,4,5,6,7,8].map(x=>`<option ${x==week?'selected':''}>${x}</option>`).join('')}</select></div>`;P[workout].forEach(x=>{let ladder=['7-6-6','7-7-6','7-7-7','8-7-7','8-8-7','8-8-8','8-8-8','8-8-8'];let target=['Incline chest press','45° leg press','T-bar row','Dumbbell Romanian deadlift'].includes(x[0])?ladder[week-1]:x[2];h+=`<article><h3>${x[0]}</h3><p>${x[1]} serie · <b>${target}</b> · ${x[4]} s recupero · RIR ${x[5]}</p>${Array.from({length:x[1]},(_,i)=>`<div class="set"><b>${i+1}</b><input placeholder="reps"><input placeholder="kg"><button onclick="log(this,'${x[0].replace(/'/g,"\\'")}')">✓</button></div>`).join('')}</article>`});return h}
function log(b,e){let r=b.parentElement;let reps=r.children[1].value,load=r.children[2].value;if(reps){data.logs.push({date:new Date().toLocaleDateString('it-IT'),exercise:e,reps,load});save();b.textContent='✓'}}
function prog(){return `<article><h2>Peso</h2><input id="w" placeholder="86.0 kg" inputmode="decimal"><button onclick="addW()">Salva</button></article><article><h2>Storico</h2>${data.weights.slice(-12).reverse().map(x=>`<p><b>${x.v} kg</b> — ${x.d}</p>`).join('')||'Nessun dato'}</article><article><h2>Bodycheck</h2><p>Spazio per vita, circonferenze e skinfold.</p></article>`}
function addW(){let v=document.getElementById('w').value;if(v){data.weights.push({v,d:new Date().toLocaleDateString('it-IT')});save();render()}}
function nut(){return `<article><h2>Target</h2><p><b>ON:</b> 2300 kcal · 175P · 65F · ~255C</p><p><b>OFF:</b> 2000 kcal · 175P · 60F · ~190C</p></article><article><h2>Integrazione</h2><p>Creatina monoidrato: <b>5 g/die</b>.</p><p>Whey: quanto serve per arrivare alle proteine.</p><p>Omega-3: non prioritario con sardine 1-2 volte/settimana.</p></article>`}
function more(){return `<article><h2>Backup</h2><button onclick="backup()">Esporta dati</button><p>Apri in Safari → Condividi → Aggiungi alla schermata Home.</p></article>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='fitprogress-backup.json';a.click()}
function timer(s){let x=document.getElementById('tm');x.className='timer';x.innerHTML=`<div><h2>Recupero</h2><b id="sec">${s}</b><button onclick="closeTm()">Chiudi</button></div>`;let i=setInterval(()=>{s--;document.getElementById('sec').textContent=s;if(s<=0)clearInterval(i)},1000)}function closeTm(){document.getElementById('tm').className='hidden'}render();
</script></body></html>
